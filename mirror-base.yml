# Shared base for every spec in this repository (rtk-ai).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# Carried unchanged from the flat spec this repository grew out of. The fleet
# rule is `build_timestamp: date`; `none` predates it. rtk versions as bare
# semver, so the `none` exception (upstream versions that already carry
# `+YYYYMMDD`) does not apply — under `none` a re-publish of an existing
# version reuses the bare tag and orphans the prior digest for registry GC.
build_timestamp: none

verify:
  github_asset_digest: true

concurrency:
  # Assets are single ~10 MB static Rust binaries in a flat archive.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. Every archive holds ONE flat
# executable at its root (`rtk`, `rtk.exe` on Windows) with no wrapper
# directory, so `strip_components: 0` leaves the executable AS the content
# root and the only honest PATH entry is a bare `${installPath}`. The scan
# only looks BELOW an interface PATH entry of the form ${installPath}/<dir>,
# so `auto`/`verify` is rejected at spec load with exit 65. `off` with a
# hand-listed `binaries` in metadata.json is the blessed shape for this asset
# layout. A future package here that ships an archive with a bin/ dir should
# override this to `verify`.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built, and upstream's target triple is not the answer
# either. rtk's two Linux builds measure DIFFERENTLY, so the two keys differ
# (measurements above rtk/mirror.yml's `assets:`):
#
#   - amd64 (…-linux-musl) is static-pie: no PT_INTERP, no DT_NEEDED. It
#     requires nothing of the host, so the key is BARE. Tagging it
#     `+libc.musl` would be a false requirement that hid the most common
#     install target from every glibc host.
#   - arm64 (…-linux-gnu) is dynamically linked against glibc — PT_INTERP
#     /lib/ld-linux-aarch64.so.1, DT_NEEDED libgcc_s.so.1 — so it carries
#     `+libc.glibc`. Upstream ships no arm64 musl build to pair it against.
#
# Container legs follow from what each key CLAIMS, and are the only mechanism
# that turns a claim into evidence:
#   - bare amd64 → ubuntu (glibc) + alpine (musl) + fedora (other glibc
#     vintage). The alpine leg IS the proof of "requires nothing"; drop it and
#     the universal claim is merely asserted.
#   - `+libc.glibc` arm64 → ubuntu + fedora, NO alpine. The glibc build cannot
#     load under musl, so an alpine leg would red on a correct artifact (the
#     renderer rejects it up front, exit 65).
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # No `windows/arm64`: upstream ships one Windows asset,
  # `rtk-x86_64-pc-windows-msvc.zip`, and nothing for aarch64.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
